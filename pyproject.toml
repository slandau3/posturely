[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posturely"
version = "0.1.0"
description = "Private, local posture feedback with quiet virtual lights"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "mediapipe>=0.10.14,<0.11",
  "numpy>=1.26,<2.3",
  "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
posturely = "posturely.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/posturely"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

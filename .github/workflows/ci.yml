name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
